[package]
name = "First_test"
version = "0.1.0"
edition = "2024"

[dependencies]
cgmath = "0.18"
anyhow = "1.0"
winit = "0.30"
env_logger = "0.11.11"
log = "0.4"
wgpu = "30.0"
pollster = "1.0.1"
bytemuck = { version = "1.24", features = ["derive"] }
tobj = { version = "3.2", default-features = false, features = ["async"] }
include_dir = "0.7"

[dependencies.image]
version = "0.25.10"
features = ["png", "jpeg"]

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"